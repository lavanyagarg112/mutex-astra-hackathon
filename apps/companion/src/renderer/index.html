<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Relaycode Companion</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f2f2f0;color:#18181b;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} button,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{padding:34px 28px;border-right:1px solid #dededb;background:#fafaf9}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:18px}.mark{width:38px;height:38px;display:grid;place-items:center;background:#09090b;color:#fff;border-radius:12px;font-size:20px}.sidecopy{margin-top:48px;color:#71717a;font-size:13px;line-height:1.6}.privacy{position:fixed;bottom:28px;width:190px;color:#a1a1aa;font-size:11px;line-height:1.5}.main{padding:52px 6vw;max-width:900px}.eyebrow{color:#71717a;text-transform:uppercase;letter-spacing:.13em;font-weight:700;font-size:10px}.title{font-size:34px;letter-spacing:-.04em;margin:8px 0}.sub{color:#71717a;line-height:1.55;margin:0 0 28px}.card{background:#fff;border:1px solid #dededb;border-radius:18px;padding:22px;box-shadow:0 1px 2px rgba(0,0,0,.03);margin-bottom:14px}.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:650}.dot{width:8px;height:8px;border-radius:50%;background:#a1a1aa}.dot.connected{background:#10b981;box-shadow:0 0 0 4px #d1fae5}.dot.connecting{background:#f59e0b}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:11px;font-weight:700;color:#52525b}.field input{border:1px solid #d4d4d8;border-radius:10px;padding:11px 12px;outline:none}.field input:focus{border-color:#18181b;box-shadow:0 0 0 3px #e4e4e7}.btn{border:0;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer}.primary{background:#09090b;color:#fff}.secondary{background:#f4f4f5;color:#27272a;border:1px solid #e4e4e7}.btn:disabled{opacity:.45;cursor:wait}.project{display:flex;align-items:center;gap:14px}.repo{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#71717a;margin-top:4px}.mapped{font-size:11px;color:#047857;margin-top:5px}.actions{display:flex;gap:8px}.empty{padding:40px 20px;text-align:center;color:#71717a}.error{display:none;margin:0 0 14px;padding:12px 14px;border:1px solid #fecaca;background:#fef2f2;color:#991b1b;border-radius:10px;font-size:12px}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="shell"><aside class="side"><div class="brand"><div class="mark">↯</div>Relaycode</div><div class="sidecopy">Your secure local runtime for AI-assisted development.</div><div class="privacy">Git credentials and source files stay on this computer.</div></aside>
  <main class="main"><div class="eyebrow">Local companion</div><h1 class="title">Connect your workspace</h1><p class="sub">Sign in once, then clone a project or connect an existing repository. Relaycode runs quietly in the background.</p><div id="error" class="error"></div><div id="app"></div></main></div>
  <script>
    const api=window.relaycode, root=document.querySelector('#app'), errorBox=document.querySelector('#error'); let state;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function fail(error){errorBox.textContent=String(error?.message||error).replace(/^Error invoking remote method '[^']+': /,'');errorBox.style.display='block'}
    function statusText(s){if(s?.state==='connected')return `Connected as ${s.userId}`;if(s?.state==='connecting')return 'Connecting…';if(s?.state==='error')return s.message;return s?.reason||'Offline'}
    function render(){errorBox.style.display='none';if(!state?.configured){root.innerHTML=`<section class="card"><div class="field"><label>Relaycode server</label><input id="server" value="http://localhost:4100"></div><button id="browserLogin" class="btn primary" style="width:100%">Continue in browser</button><div class="field" style="margin-top:20px"><label>Pairing code from Relaycode</label><div class="row"><input id="code" placeholder="ABC123" maxlength="12" style="flex:1;text-transform:uppercase"><button id="claim" class="btn secondary">Pair this device</button></div></div><details style="margin-top:18px"><summary style="font-size:11px;color:#71717a;cursor:pointer">Local development fallback</summary><div class="field"><label>Username</label><input id="username" placeholder="alice" autocomplete="username"></div><div class="field"><label>Companion token</label><input id="token" type="password" placeholder="alice-daemon-token"></div><button id="connect" class="btn secondary">Connect without browser</button></details></section>`;document.querySelector('#browserLogin').onclick=browserLogin;document.querySelector('#claim').onclick=claim;document.querySelector('#connect').onclick=connect;return}
      const mappings=state.mappings||{};root.innerHTML=`<section class="card row"><div class="dot ${esc(state.status?.state)}"></div><div class="grow"><div class="status">${esc(statusText(state.status))}</div><div class="repo">${esc(state.serverUrl)}</div></div><button id="refresh" class="btn secondary">Refresh</button></section><div class="eyebrow" style="margin:28px 0 10px">Your projects</div><div id="projects">${state.projects?.length?state.projects.map(p=>`<section class="card project"><div class="mark" style="width:38px;height:38px;font-size:13px">${esc(p.name.slice(0,1))}</div><div class="grow"><strong>${esc(p.name)}</strong><div class="repo">${esc(p.repositoryUrl)} · ${esc(p.branch)}</div>${mappings[p.id]?`<div class="mapped">✓ Connected at ${esc(mappings[p.id].path)}</div>`:''}</div><div class="actions">${mappings[p.id]?'':`<button class="btn secondary" data-map="${esc(p.id)}">Use existing folder</button><button class="btn primary" data-clone="${esc(p.id)}">Clone project</button>`}</div></section>`).join(''):`<section class="card empty">No projects are available for this account.</section>`}</div>`;
      document.querySelector('#refresh').onclick=refresh;document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>act('map',b.dataset.map,b));document.querySelectorAll('[data-clone]').forEach(b=>b.onclick=()=>act('clone',b.dataset.clone,b));}
    async function connect(){const b=document.querySelector('#connect');b.disabled=true;try{state=await api.configure({serverUrl:document.querySelector('#server').value,username:document.querySelector('#username').value,daemonToken:document.querySelector('#token').value});render()}catch(e){fail(e);b.disabled=false}}
    async function browserLogin(){const b=document.querySelector('#browserLogin');b.disabled=true;b.textContent='Waiting for browser…';try{await api.browserLogin(document.querySelector('#server').value)}catch(e){fail(e);b.disabled=false;b.textContent='Continue in browser'}}
    async function claim(){const b=document.querySelector('#claim');b.disabled=true;try{state=await api.claim(document.querySelector('#server').value,document.querySelector('#code').value);render()}catch(e){fail(e);b.disabled=false}}
    async function act(kind,id,b){b.disabled=true;try{state=await api[kind](state.projects.find(p=>p.id===id));render()}catch(e){fail(e);b.disabled=false}}
    async function refresh(){try{state=await api.refresh();render()}catch(e){fail(e)}}
    api.onStatus(s=>{if(state){state.status=s;render()}});api.onPaired(refresh);api.state().then(s=>{state=s;render()}).catch(fail);
  </script>
</body></html>
